# Example: http-context directives for odoo-forward-auth.
# Paste these into the `http` block of your Nginx configuration.
# Requires ngx_http_auth_request_module (check: nginx -V 2>&1 | grep auth_request).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream odoo_forward_auth_backend {
    server 127.0.0.1:8069;
}
