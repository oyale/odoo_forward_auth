# Example: protect /app/ behind the Odoo forward-auth endpoint.
# Requires ngx_http_auth_request_module (check: nginx -V 2>&1 | grep auth_request).

upstream odoo_forward_auth_backend {
    server 127.0.0.1:8069;
}

# Internal subrequest target. Never exposed to clients.
location = /_forward_auth {
    internal;
    proxy_pass http://odoo_forward_auth_backend/odoo-forward-auth/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization "";
}

# The protected service (example: a MailHog-style inbox on loopback).
location ^~ /app/ {
    auth_request /_forward_auth;

    # Optional read-only enforcement: drop every non-safe method.
    limit_except GET HEAD { deny all; }

    proxy_pass http://127.0.0.1:8025;
    # The upstream does not need the Odoo session cookie or the client credential.
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (if the upstream uses one).
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
}

