# Example: protect /app/ behind the Odoo forward-auth endpoint (server context).
# Put the http-context directives (upstream) from
# examples/nginx-forward-auth-http.conf in your http block first.

# Internal subrequest target. Never exposed to clients.
location = /_forward_auth {
    internal;
    proxy_pass http://odoo_forward_auth_backend/odoo-forward-auth/auth;
    proxy_cache off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization "";
}

# The protected service (example: a MailHog-style inbox on loopback).
location ^~ /app/ {
    satisfy all;
    auth_request /_forward_auth;
    proxy_cache off;

    # HTTP method restriction; the upstream must also enforce read-only behavior.
    limit_except GET HEAD { deny all; }

    proxy_pass http://127.0.0.1:8025;
    # The upstream does not need the Odoo session cookie or the client credential.
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Upgrades are disabled; HTTP method restrictions cannot constrain WS messages.
    proxy_http_version 1.1;
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
}

# Denials stay 401, including authenticated users without the required group.
# Sign in at /web/login, then revisit /app/.
