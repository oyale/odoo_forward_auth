name: Integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  odoo-nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        demo: ['0', '1']
    env:
      FORWARD_AUTH_DEMO: ${{ matrix.demo }}
    steps:
      - uses: actions/checkout@v7
      - run: sh tests/integration/run.sh
